services:
  streamscheduler1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: streamscheduler1
    ports:
      - "7577:7577"
    volumes:
      - data:/app/data
      - uploads:/app/uploads
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=7577
      - JWT_SECRET=${JWT_SECRET}
volumes:                            # ← This declares the volumes
  data:
  uploads:
