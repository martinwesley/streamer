services:
  streamscheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: streamscheduler
    ports:
      - "7576:7576"
    volumes:
      - data:/app/data
      - uploads:/app/uploads
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=7576
      - JWT_SECRET=${JWT_SECRET}
volumes:                            # ← This declares the volumes
  data:
  uploads:
